<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="1"/>
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4f4f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#71717a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <mask id="fade">
      <rect width="1200" height="630" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#fade)"/>
  <!-- Accent line -->
  <rect x="80" y="300" width="120" height="4" rx="2" fill="url(#accentGrad)"/>
  <!-- Name -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#textGrad)">Brian Tellez</text>
  <!-- Job title -->
  <text x="80" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#71717a">Ingeniero en Sistemas Computacionales</text>
  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#52525b">Full Stack · DevOps · Homelab · Tijuana, México</text>
  <!-- Domain -->
  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#3b82f6">briantellez.ourocore.net</text>
  <!-- Right side decorative elements -->
  <circle cx="950" cy="315" r="180" fill="#3b82f610" stroke="#3b82f620" stroke-width="1"/>
  <circle cx="950" cy="315" r="120" fill="#8b5cf610" stroke="#8b5cf620" stroke-width="1"/>
  <circle cx="950" cy="315" r="60" fill="#3b82f620" stroke="#3b82f640" stroke-width="1"/>
  <!-- Tech badges -->
  <rect x="700" y="470" width="90" height="32" rx="16" fill="#3b82f615" stroke="#3b82f640" stroke-width="1"/>
  <text x="745" y="491" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#3b82f6" text-anchor="middle">Next.js</text>
  <rect x="800" y="470" width="90" height="32" rx="16" fill="#8b5cf615" stroke="#8b5cf640" stroke-width="1"/>
  <text x="845" y="491" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#8b5cf6" text-anchor="middle">Docker</text>
  <rect x="900" y="470" width="90" height="32" rx="16" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-opacity="0.25" stroke-width="1"/>
  <text x="945" y="491" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#f97316" text-anchor="middle">Linux</text>
  <rect x="1000" y="470" width="90" height="32" rx="16" fill="#22c55e15" stroke="#22c55e40" stroke-width="1"/>
  <text x="1045" y="491" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#22c55e" text-anchor="middle">Python</text>
</svg>
